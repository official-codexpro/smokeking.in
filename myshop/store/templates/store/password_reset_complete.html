{% extends 'store/base.html' %}
{% block title %}Password Reset Complete - Smoke King{% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-6">
      <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-3">Password updated!</h1>
    <p class="text-gray-600 mb-8">Your password has been successfully reset. You can now sign in with your new password.</p>
    <a href="/accounts/login/" class="inline-block bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-bold py-3 px-8 rounded-xl hover:from-yellow-500 hover:to-amber-600 transition-all duration-300">
      Sign In
    </a>
  </div>
</div>
{% endblock %}
