{% extends 'store/base.html' %}
{% block title %}Forgot Password - Smoke King{% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-yellow-100 rounded-full mb-4">
        <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Forgot your password?</h1>
      <p class="text-gray-600 mt-2">Enter your email and we'll send you a reset link.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Email address</label>
          <input type="email" name="email" required autofocus
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent text-base"
            placeholder="you@example.com">
        </div>
        <button type="submit"
          class="w-full bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-bold py-3 rounded-xl hover:from-yellow-500 hover:to-amber-600 transition-all duration-300">
          Send Reset Link
        </button>
      </form>
      <div class="mt-6 text-center text-sm text-gray-600">
        Remember your password?
        <a href="/accounts/login/" class="text-yellow-600 font-semibold hover:underline ml-1">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
