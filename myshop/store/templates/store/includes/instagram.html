<script>
document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.reel-card');
    let activeVideo = null;

    const stopAll = (except) => {
        cards.forEach(card => {
            const v = card.querySelector('.custom-reel');
            if (v !== except) {
                v.pause();
                v.currentTime = 0;
                v.muted = true;
                updateMuteUI(card, true);
            }
        });
    };

    const updateMuteUI = (card, isMuted) => {
        const iconUnmuted = card.querySelector('.icon-unmuted');
        const iconMuted = card.querySelector('.icon-muted');

        if (isMuted) {
            iconUnmuted.classList.add('hidden');
            iconMuted.classList.remove('hidden');
        } else {
            iconUnmuted.classList.remove('hidden');
            iconMuted.classList.add('hidden');
        }
    };

    const playVideo = (card, withSound = true) => {
        const video = card.querySelector('.custom-reel');

        stopAll(video);

        video.muted = !withSound;
        video.volume = 1;

        activeVideo = video;

        video.play().catch(() => {
            // fallback if sound blocked
            video.muted = true;
            video.play();
        });

        updateMuteUI(card, video.muted);
    };

    cards.forEach(card => {
        const video = card.querySelector('.custom-reel');
        const muteBtn = card.querySelector('.mute-toggle');
        const progress = card.querySelector('.video-progress');

        // 👉 HOVER → try sound ON
        card.addEventListener('mouseenter', () => {
            playVideo(card, true);
        });

        card.addEventListener('mouseleave', () => {
            video.pause();
        });

        // 👉 CLICK → force sound ON
        card.addEventListener('click', () => {
            if (video.paused) {
                playVideo(card, true);
            } else {
                video.pause();
                activeVideo = null;
            }
        });

        // 👉 MUTE BUTTON
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();

            if (video.paused) {
                playVideo(card, true);
                return;
            }

            video.muted = !video.muted;
            updateMuteUI(card, video.muted);
        });

        // 👉 PROGRESS BAR
        video.addEventListener('timeupdate', () => {
            if (video.duration && progress) {
                const pct = (video.currentTime / video.duration) * 100;
                progress.style.width = pct + '%';
            }
        });

        // 👉 INITIAL STATE
        video.muted = true;
        updateMuteUI(card, true);

        // smooth load
        video.style.opacity = 0;
        video.addEventListener('loadeddata', () => {
            video.style.opacity = 1;
        });
    });
});
</script>
