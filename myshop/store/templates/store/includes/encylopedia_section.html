{% load static %}

<section class="relative w-screen overflow-hidden bg-white flex items-center justify-center border-y border-black/10 py-16 md:py-0"
style="min-height: 42vh; left:50%; right:50%; margin-left:-50vw; margin-right:-50vw;">

  <div class="absolute inset-0 opacity-[0.04]"
       style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 32px 32px;"></div>

  <div class="absolute -bottom-24 -left-20 md:-bottom-32 md:-left-32 w-[300px] md:w-[420px] h-[300px] md:h-[420px] bg-[#d4af37]/15 rounded-full blur-[90px] md:blur-[140px]"></div>

  <div class="relative z-10 w-full max-w-[1400px] px-8 md:px-12 flex flex-col md:flex-row items-center justify-between gap-12 md:gap-10">

    <div class="flex-1 border-l-[2px] md:border-l-[3px] border-[#d4af37] pl-6 md:pl-10">

      <span class="text-[#d4af37] text-[10px] md:text-xs uppercase tracking-[0.5em] md:tracking-[0.6em] font-bold mb-3 block">
        Digital Archive
      </span>

      <h2 class="text-gray-900 text-3xl md:text-5xl font-bold uppercase tracking-[0.15em] md:tracking-widest leading-[1.1] md:leading-tight">
        THE MASTER <br>
        <span class="text-[#d4af37]">Encyclopedia</span>
      </h2>

      <p class="mt-6 text-gray-600 text-[13px] md:text-base max-w-xl leading-relaxed tracking-wide">
        Explore the complete luxury lighter encyclopedia. Discover craftsmanship,
        iconic designs, and the heritage behind every premium flame.
      </p>

      <div class="mt-8 md:mt-6 w-16 md:w-20 h-[1px] bg-[#d4af37]"></div>

    </div>

    <div class="flex-none w-full md:w-auto">

      <a href="/encyclopedia/"
         class="group relative inline-flex items-center gap-6 bg-[#111111] text-white px-10 md:px-12 py-5 text-[11px] md:text-xs font-bold uppercase tracking-[0.3em] transition-all duration-300 hover:bg-[#d4af37] hover:text-black shadow-xl overflow-hidden"
         style="text-decoration:none;">
        
        <span class="absolute inset-0 w-full h-full bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity"></span>

        <span class="relative z-10">Explore Now</span>

        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-5 w-5 relative z-10 transform group-hover:translate-x-2 transition-transform duration-300"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
        </svg>

      </a>

    </div>

  </div>

  <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-[#d4af37]/40 to-transparent"></div>

</section>
