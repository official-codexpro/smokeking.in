{% extends 'store/base.html' %}
{% block title %}Check Your Email - Smoke King{% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-6">
      <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-3">Check your email</h1>
    <p class="text-gray-600 mb-2">We've sent a password reset link to your email address.</p>
    <p class="text-gray-500 text-sm mb-8">If you don't see it, check your spam folder.</p>
    <a href="/accounts/login/" class="inline-block bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-bold py-3 px-8 rounded-xl hover:from-yellow-500 hover:to-amber-600 transition-all duration-300">
      Back to Login
    </a>
  </div>
</div>
{% endblock %}
